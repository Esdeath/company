<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>企业快照库 · 交互原型</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f2f5f6;
      --surface: #ffffff;
      --ink: #17212b;
      --muted: #66727d;
      --line: #d7dee3;
      --accent: #155e75;
      --accent-soft: #e4f0f2;
      --positive: #2f6b4f;
      --positive-soft: #e6f0eb;
      --caution: #a15c16;
      --caution-soft: #f8ecdc;
      --negative: #a33a3a;
      --negative-soft: #f8e6e6;
      --radius-card: 8px;
      --radius-control: 6px;
      --shadow: 0 18px 55px rgba(23, 33, 43, 0.1);
      --font-display: "Iowan Old Style", "Songti SC", "STSong", serif;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-data: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: #dfe5e7;
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.6;
    }
    button, input, select { font: inherit; }
    button, a, select { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: 3px solid rgba(21, 94, 117, 0.35);
      outline-offset: 2px;
    }
    .prototype-frame { min-height: 100vh; }
    .prototype-stage {
      min-height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      background: var(--canvas);
      transition: width 180ms ease, box-shadow 180ms ease;
    }
    .prototype-stage.is-mobile {
      width: min(390px, 100%);
      box-shadow: var(--shadow);
    }
    .building-state {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      color: var(--muted);
    }
    .building-state strong {
      display: block;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: clamp(26px, 5vw, 48px);
      font-weight: 600;
    }
    .prototype-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 52px;
      padding: 8px 14px;
      overflow-x: auto;
      color: #f7fafb;
      background: #111a22;
      border-bottom: 1px solid #31404b;
      scrollbar-width: thin;
    }
    .prototype-bar__label {
      margin-right: auto;
      white-space: nowrap;
      font-family: var(--font-data);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .prototype-bar button, .prototype-bar select {
      min-height: 34px;
      padding: 6px 10px;
      white-space: nowrap;
      color: #dce6ea;
      background: #1c2832;
      border: 1px solid #40515e;
      border-radius: 4px;
      cursor: pointer;
    }
    .prototype-bar button:hover, .prototype-bar button.is-active {
      color: #fff;
      background: #155e75;
      border-color: #2c819a;
    }
    .site-shell { min-height: calc(100vh - 52px); }
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      padding: 0 24px;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 750;
      letter-spacing: -0.02em;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      color: #fff;
      background: var(--accent);
      border-radius: 50% 50% 50% 8px;
      font-family: var(--font-data);
      font-size: 11px;
    }
    .site-nav { display: flex; align-items: center; gap: 18px; }
    .site-nav a, .site-nav button {
      padding: 4px;
      color: var(--muted);
      background: transparent;
      border: 0;
      text-decoration: none;
      cursor: pointer;
    }
    .page-wrap { width: min(1180px, calc(100% - 48px)); margin: 0 auto; }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
      gap: 48px;
      padding: 72px 0 52px;
      border-bottom: 1px solid var(--line);
    }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-family: var(--font-data);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .hero h1, .snapshot-title {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.12;
    }
    .hero h1 { max-width: 760px; font-size: clamp(38px, 5.5vw, 72px); }
    .hero-copy { max-width: 640px; margin: 20px 0 0; color: var(--muted); font-size: 17px; }
    .hero-note {
      align-self: end;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-top: 3px solid var(--accent);
      border-radius: var(--radius-card);
    }
    .hero-note strong { display: block; margin-bottom: 6px; }
    .hero-note p { margin: 0; color: var(--muted); font-size: 14px; }
    .search-panel { padding: 28px 0 22px; }
    .search-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    .search-input {
      width: 100%;
      min-height: 50px;
      padding: 0 16px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid #aebbc1;
      border-radius: var(--radius-control);
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 42px;
      padding: 9px 16px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-control);
      text-decoration: none;
      cursor: pointer;
    }
    .button:hover { border-color: #9aabb3; }
    .button--primary { color: #fff; background: var(--accent); border-color: var(--accent); }
    .button--quiet { min-height: 34px; padding: 5px 10px; color: var(--muted); background: transparent; }
    .filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-top: 14px;
    }
    .filter-group { display: flex; flex-wrap: wrap; gap: 7px; }
    .filter-button {
      min-height: 34px;
      padding: 5px 12px;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 999px;
      cursor: pointer;
    }
    .filter-button.is-active { color: var(--accent); background: var(--accent-soft); border-color: #b8d4da; }
    .sort-control { min-height: 36px; padding: 5px 32px 5px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-control); }
    .result-header { display: flex; align-items: end; justify-content: space-between; gap: 16px; padding: 22px 0 14px; }
    .result-header h2 { margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 600; }
    .result-count { color: var(--muted); font-family: var(--font-data); font-size: 12px; }
    .snapshot-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding-bottom: 64px; }
    .snapshot-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 250px;
      padding: 20px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }
    .snapshot-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: var(--accent);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 160ms ease;
    }
    .snapshot-card:hover { transform: translateY(-2px); border-color: #b5c4ca; box-shadow: 0 14px 34px rgba(23, 33, 43, 0.08); }
    .snapshot-card:hover::before { transform: scaleY(1); }
    .card-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-family: var(--font-data); font-size: 11px; }
    .market-tag { padding: 2px 7px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; }
    .snapshot-card h3 { margin: 20px 0 7px; font-family: var(--font-display); font-size: 25px; font-weight: 600; line-height: 1.2; }
    .ticker { color: var(--muted); font-family: var(--font-data); font-size: 12px; }
    .card-summary { margin: 15px 0 18px; color: var(--muted); font-size: 14px; }
    .mini-metrics { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: auto; padding-top: 13px; border-top: 1px solid var(--line); }
    .mini-metric { font-family: var(--font-data); font-size: 11px; }
    .mini-metric span { color: var(--muted); }
    .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
    .verdict { display: inline-flex; align-items: center; gap: 6px; color: var(--positive); font-size: 12px; font-weight: 700; }
    .verdict::before { content: ""; width: 7px; height: 7px; background: currentColor; border-radius: 50%; }
    .verdict--skip { color: var(--caution); }
    .card-link { padding: 6px; color: var(--accent); background: transparent; border: 0; cursor: pointer; }
    .empty-state {
      grid-column: 1 / -1;
      padding: 64px 24px;
      text-align: center;
      background: var(--surface);
      border: 1px dashed #aebbc1;
      border-radius: var(--radius-card);
    }
    .empty-state__mark { display: grid; place-items: center; width: 54px; height: 54px; margin: 0 auto 16px; color: var(--accent); background: var(--accent-soft); border-radius: 50%; font-family: var(--font-data); }
    .empty-state h3 { margin: 0; font-family: var(--font-display); font-size: 26px; }
    .empty-state p { margin: 8px auto 20px; max-width: 440px; color: var(--muted); }
    .snapshot-page { padding: 30px 0 72px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; padding: 5px 0; color: var(--muted); background: transparent; border: 0; cursor: pointer; }
    .snapshot-head { padding: 34px 0 26px; border-bottom: 1px solid var(--line); }
    .snapshot-kicker { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 12px; color: var(--muted); font-family: var(--font-data); font-size: 12px; }
    .snapshot-title { font-size: clamp(38px, 5vw, 62px); }
    .snapshot-summary { max-width: 760px; margin: 16px 0 0; color: var(--muted); font-size: 17px; }
    .metric-strip { display: grid; grid-template-columns: repeat(4, 1fr); margin: 22px 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); }
    .metric { padding: 16px 18px; border-right: 1px solid var(--line); }
    .metric:last-child { border-right: 0; }
    .metric-label { display: block; color: var(--muted); font-size: 11px; }
    .metric-value { display: block; margin-top: 4px; font-family: var(--font-data); font-size: 18px; font-weight: 700; }
    .verdict-banner { display: flex; align-items: start; justify-content: space-between; gap: 20px; padding: 16px 18px; color: var(--positive); background: var(--positive-soft); border: 1px solid #bfd5c7; border-radius: var(--radius-card); }
    .verdict-banner.is-skip { color: var(--caution); background: var(--caution-soft); border-color: #e6c89e; }
    .verdict-banner strong { display: block; }
    .verdict-banner small { color: var(--muted); }
    .scan-rail { display: grid; grid-template-columns: repeat(5, 1fr); margin: 28px 0; background: #192630; border-radius: var(--radius-card); overflow: hidden; }
    .scan-step { position: relative; padding: 16px; color: #dce7ea; border-right: 1px solid #3d4c57; }
    .scan-step:last-child { border-right: 0; }
    .scan-number { display: block; color: #7fb5c4; font-family: var(--font-data); font-size: 10px; letter-spacing: 0.12em; }
    .scan-label { display: block; margin-top: 5px; font-size: 13px; }
    .snapshot-grid { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 44px; align-items: start; }
    .snapshot-body { min-width: 0; }
    .research-section { scroll-margin-top: 80px; padding: 30px 0; border-bottom: 1px solid var(--line); }
    .research-section h2 { margin: 0 0 14px; font-family: var(--font-display); font-size: 30px; font-weight: 600; }
    .evidence-block { padding: 17px 18px; background: var(--surface); border: 1px solid var(--line); border-left-width: 4px; border-radius: 0 var(--radius-card) var(--radius-card) 0; }
    .evidence-block--fact { border-left-color: var(--accent); }
    .evidence-block--judgement { border-left-color: var(--positive); }
    .evidence-block--todo { border-left-color: var(--caution); }
    .evidence-label { display: block; margin-bottom: 6px; color: var(--muted); font-family: var(--font-data); font-size: 10px; font-weight: 700; letter-spacing: 0.12em; }
    .evidence-block p { margin: 0; }
    .source-list { margin: 0; padding-left: 20px; color: var(--muted); }
    .snapshot-toc { position: sticky; top: 72px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); }
    .snapshot-toc h2 { margin: 0 0 10px; font-size: 13px; }
    .snapshot-toc a { display: block; padding: 6px 0; color: var(--muted); text-decoration: none; font-size: 13px; }
    .snapshot-toc a:hover { color: var(--accent); }
    .version-list { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
    .version-list button { display: block; width: 100%; padding: 7px 0; text-align: left; color: var(--muted); background: transparent; border: 0; cursor: pointer; }
    .version-list button.is-active { color: var(--accent); font-weight: 700; }
    .mobile-toc-toggle { display: none; margin: 18px 0 0; }
    .disclaimer { margin-top: 32px; padding: 16px 18px; color: var(--muted); background: #e9edef; border-radius: var(--radius-card); font-size: 13px; }
    .value-page { width: min(1320px, calc(100% - 48px)); }
    .value-metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin: 22px 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); }
    .value-metric { min-width: 0; padding: 16px; border-right: 1px solid var(--line); }
    .value-metric:last-child { border-right: 0; }
    .value-metric__label { display: block; color: var(--muted); font-size: 11px; }
    .value-metric__value { display: block; margin: 5px 0 2px; font-family: var(--font-data); font-size: clamp(15px, 1.55vw, 21px); font-weight: 750; white-space: nowrap; }
    .value-metric__note { display: block; color: var(--muted); font-size: 10px; line-height: 1.35; }
    .value-conclusion { padding: 22px; color: #e8f0f2; background: #17242d; border-radius: var(--radius-card); }
    .value-conclusion__head { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 14px; }
    .value-conclusion h2 { margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 600; }
    .value-stamp { padding: 5px 11px; color: #dff0e5; background: #2f6b4f; border: 1px solid #5c8d72; border-radius: 999px; font-size: 12px; font-weight: 750; }
    .value-evidence { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 14px; padding: 13px 0; border-top: 1px solid #33434d; }
    .value-evidence:first-of-type { border-top: 0; }
    .value-evidence__label { color: #85b9c6; font-family: var(--font-data); font-size: 11px; font-weight: 750; letter-spacing: 0.08em; }
    .value-evidence p { margin: 0; color: #dbe5e8; }
    .value-evidence--question .value-evidence__label { color: #e1b77e; }
    .value-scan-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin: 16px 0 30px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); overflow: hidden; }
    .value-scan { display: block; min-width: 0; padding: 14px; color: var(--ink); background: transparent; border: 0; border-right: 1px solid var(--line); text-decoration: none; }
    .value-scan:last-child { border-right: 0; }
    .value-scan:hover { background: #f7f9f9; }
    .value-scan__number { display: block; color: var(--accent); font-family: var(--font-data); font-size: 10px; }
    .value-scan__label { display: block; margin: 5px 0 7px; font-weight: 750; }
    .value-scan__result { display: block; color: var(--positive); font-size: 11px; line-height: 1.35; }
    .value-scan--watch .value-scan__result { color: var(--caution); }
    .value-layout { display: grid; grid-template-columns: minmax(0, 1fr) 235px; gap: 28px; align-items: start; }
    .value-body { min-width: 0; }
    .value-section { scroll-margin-top: 74px; margin-bottom: 18px; padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); }
    .value-section__head { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 15px; }
    .value-section h2 { margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 600; line-height: 1.2; }
    .value-section__hint { color: var(--muted); font-size: 11px; text-align: right; }
    .value-thesis { margin-top: 16px; padding: 15px 17px; color: var(--ink); background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: 0 var(--radius-control) var(--radius-control) 0; }
    .value-table-shell { min-width: 0; }
    .value-table-tools { display: flex; justify-content: flex-end; gap: 7px; margin-bottom: 9px; }
    .value-table-tools button { padding: 5px 9px; color: var(--accent); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-control); font-size: 11px; cursor: pointer; }
    .value-table-scroll { max-width: 100%; max-height: 520px; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-control); scrollbar-color: #9fb0b7 #eef2f3; }
    .value-table { width: max-content; min-width: 100%; border-collapse: separate; border-spacing: 0; font-family: var(--font-data); font-size: 11px; }
    .value-table th, .value-table td { min-width: 82px; padding: 9px 10px; color: var(--ink); background: var(--surface); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
    .value-table thead th { position: sticky; top: 0; z-index: 2; color: #dce7ea; background: #263640; font-weight: 650; }
    .value-table th:first-child, .value-table td:first-child { position: sticky; left: 0; z-index: 1; min-width: 174px; text-align: left; background: #f6f8f8; font-family: var(--font-body); font-weight: 650; }
    .value-table thead th:first-child { z-index: 3; color: #dce7ea; background: #263640; }
    .value-table tr:last-child th, .value-table tr:last-child td { border-bottom: 0; }
    .value-table th:last-child, .value-table td:last-child { border-right: 0; }
    .value-table .is-negative { color: var(--negative); background: var(--negative-soft); font-weight: 750; }
    .value-notes { display: grid; gap: 9px; margin-top: 13px; }
    .value-note { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; padding: 13px; background: #f6f8f8; border-radius: var(--radius-control); }
    .value-note__number { display: grid; place-items: center; width: 26px; height: 26px; color: #fff; background: var(--accent); border-radius: 50%; font-family: var(--font-data); font-size: 11px; }
    .value-note p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    .value-note__result { display: inline-block; margin-top: 7px; color: var(--positive); font-size: 11px; font-weight: 750; }
    .value-note--watch .value-note__result { color: var(--caution); }
    .value-small-table { width: 100%; border-collapse: collapse; }
    .value-small-table th, .value-small-table td { padding: 10px 12px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
    .value-small-table th { color: var(--muted); background: #f6f8f8; font-size: 11px; }
    .value-small-table td { font-size: 13px; }
    .value-small-table td:last-child { font-family: var(--font-data); }
    .value-duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .value-capital-list { margin: 0 0 14px; padding-left: 20px; color: var(--muted); font-size: 13px; }
    .value-capital-list li + li { margin-top: 5px; }
    .question-scroll { overflow-x: auto; }
    .question-table { width: 100%; min-width: 780px; border-collapse: collapse; }
    .question-table th, .question-table td { padding: 11px 12px; border: 1px solid var(--line); text-align: left; vertical-align: top; font-size: 12px; }
    .question-table th { color: var(--muted); background: #f6f8f8; }
    .question-answerable { color: var(--positive); font-weight: 750; white-space: nowrap; }
    .question-external { color: var(--caution); font-weight: 750; white-space: nowrap; }
    .value-handoff { margin-top: 14px; padding: 15px; color: var(--ink); background: var(--caution-soft); border-left: 4px solid var(--caution); }
    .value-methodology { color: var(--muted); font-size: 12px; }
    .value-toc { position: sticky; top: 70px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); }
    .value-toc h2 { margin: 0 0 9px; font-size: 12px; }
    .value-toc a { display: block; padding: 5px 0; color: var(--muted); text-decoration: none; font-size: 12px; }
    .value-toc a:hover { color: var(--accent); }
    .value-compact .value-metrics, .value-compact .value-conclusion, .value-compact .value-scan-grid { margin-top: 0; }
    .site-footer { padding: 26px 24px; color: var(--muted); background: #e6ebed; border-top: 1px solid var(--line); font-size: 12px; }

        }
        return `<section class='research-section' id='${section.id}'><h2>${section.title}</h2><div class='evidence-block evidence-block--${section.kind}'><span class='evidence-label'>${evidenceLabel(section.kind)}</span><p>${section.body}</p></div></section>`;
      }

      function renderSimpleSnapshot(snapshot) {
        const versions = snapshots.filter((item) => item.market === snapshot.market && item.ticker === snapshot.ticker);
        const skip = snapshot.verdict === 'skip';

          <div class='site-shell' data-route="snapshot">

                ${snapshot.sections.map((section, index) => `<div class='scan-step'><span class='scan-number'>0${index + 1}</span><span class='scan-label'>${section.title.replace(/^.+、/, '')}</span></div>`).join('')}

                <article class='snapshot-body'>${snapshot.sections.map(renderResearchSection).join('')}<div class='disclaimer'>内容基于公开资料整理，仅供研究参考，不构成投资建议。财务数据以公司正式披露为准。</div></article>

      function renderValueTable(table, tableId) {

              </table>
            </div>
          </div>`;

      function renderEvidenceNote(note) {
        return `<div class='value-note ${note.tone === 'watch' ? 'value-note--watch' : ''}'><span class='value-note__number'>${note.number}</span><div><strong>${note.title}</strong><p>${note.body}</p><span class='value-note__result'>${note.tone === 'watch' ? '△' : '✓'} ${note.result}</span></div></div>`;

        const capitalTable = { label: '资本结构与流动性', years: snapshot.capitalStructure.years, rows: snapshot.capitalStructure.rows };
        return `
          <div class='value-content ${compact ? 'value-compact' : ''}'>
            <div class='value-metrics'>${metricMarkup}</div>

            </section>
            <section class='value-section' id='capital-structure' data-value-section="capital-structure">
              <div class='value-duo'>
                <div><div class='value-section__head'><h2>资本结构与流动性</h2></div><ul class='value-capital-list'>${snapshot.capitalStructure.bullets.map((item) => `<li>${item}</li>`).join('')}</ul>${renderValueTable(capitalTable, 'maotai-capital-table')}<div class='value-thesis'>${snapshot.capitalStructure.note}</div></div>
                <div><div class='value-section__head'><h2>年均变化率</h2><span class='value-section__hint'>${snapshot.cagr.period}</span></div><table class='value-small-table'><thead><tr><th>指标</th><th>复合增长</th></tr></thead><tbody>${snapshot.cagr.rows.map((row) => `<tr><td>${row.label}</td><td>${row.value}</td></tr>`).join('')}</tbody></table><div class='value-thesis'>${snapshot.cagr.note}</div></div>
              </div>
            </section>
            <section class='value-section' id='five-questions' data-value-section="five-questions">
              <div class='value-section__head'><h2>五问检查清单</h2><span class='value-section__hint'>前两问页面内，后三问从合上页面开始</span></div>
              <div class='question-scroll'><table class='question-table'><thead><tr><th>#</th><th>问题</th><th>本页能答吗</th><th>贵州茅台的答案 / 去处</th></tr></thead><tbody>${snapshot.fiveQuestions.map((item) => `<tr><td>${item.number}</td><td>${item.question}</td><td class='${item.answerable ? 'question-answerable' : 'question-external'}'>${item.answerable ? '✓ 页面内' : '✋ 页面外'}</td><td>${item.answer}</td></tr>`).join('')}</tbody></table></div>

      function renderAdminSidebar(active) {

      function renderAdminRows(records) {

            <div class='admin-toolbar'>
              <div class='admin-toolbar__group'>${[['all', '全部'], ['draft', '草稿'], ['published', '已发布'], ['withdrawn', '已撤回']].map(([value, label]) => `<button class='filter-button ${state.adminStatusFilter === value ? 'is-active' : ''}' type='button' data-action='admin-filter' data-value='${value}'>${label}</button>`).join('')}</div>
              <div class='admin-toolbar__group'><select class='sort-control' data-action='admin-market' aria-label='管理市场筛选'><option value='ALL'>全部市场</option><option value='CN' ${state.adminMarketFilter === 'CN' ? 'selected' : ''}>A 股</option><option value='HK' ${state.adminMarketFilter === 'HK' ? 'selected' : ''}>港股</option></select><input class='admin-search' value='${escapeHtml(state.adminQuery)}' data-action='admin-query' aria-label='搜索管理快照' placeholder='公司或代码'></div>
            </div>
            <div class='admin-panel'><table class='admin-table'><thead><tr><th>公司</th><th>市场</th><th>数据日期</th><th>状态</th><th>校验</th><th>更新</th><th>操作</th></tr></thead><tbody>${renderAdminRows(records)}</tbody></table><div class='admin-card-list'>${renderAdminCards(records)}</div></div>
          </main>`;
        return renderAdminShell(content);
      }

      function renderValidationList(title, items, tone, emptyText) {
        return `<div class='validation-group ${tone}'><h3>${title}</h3>${items.length ? `<ul>${items.map((item) => `<li>${item}</li>`).join('')}</ul>` : `<p class='ticker'>${emptyText}</p>`}</div>`;
      }

      function renderReviewCheck(record, report) {
        const snapshot = snapshots.find((item) => item.id === record.snapshotId);
        const summary = snapshot?.summary || '格式错误，未建立公开快照';
        return `
          <section class='review-panel'>
            <h2>元数据</h2><dl class='metadata-list'><dt>公司</dt><dd>${record.companyName}</dd><dt>代码</dt><dd>${record.ticker}</dd><dt>市场</dt><dd>${record.market}</dd><dt>数据日期</dt><dd>${record.dataAsOf}</dd>${record.quoteAsOf ? `<dt>行情时间</dt><dd>${record.quoteAsOf}</dd>` : ''}<dt>文件</dt><dd>${record.market}/${record.ticker}/${record.dataAsOf}.md</dd><dt>摘要</dt><dd>${summary}</dd></dl>
            ${renderValidationList('校验错误', report.errors, 'report-error', '没有错误')}
            ${renderValidationList('校验警告', report.warnings, 'report-warning', '没有警告')}
            ${renderValidationList('标准化信息', report.info, 'report-info', '没有标准化信息')}
          </section>`;
      }

      function renderSimplePreview(snapshot) {
        return `<h2 class='snapshot-title'>${snapshot.companyName}</h2><p class='snapshot-summary'>${snapshot.summary}</p>${snapshot.sections.map(renderResearchSection).join('')}`;
      }

      function renderInvalidPreview() {
        return `<div class='empty-state'><span class='empty-state__mark'>!</span><h3>无法生成公开预览</h3><p>文件校验失败，无法生成公开预览。请先补全 reporting_currency 和“五、资料来源”。</p></div>`;
      }

      function renderReviewSnapshotContent(record) {
        if (!record.snapshotId) return renderInvalidPreview();
        const snapshot = snapshots.find((item) => item.id === record.snapshotId);
        return snapshot.format === 'value_line' ? renderValueLineBody(snapshot, { compact: true }) : renderSimplePreview(snapshot);
      }

      function renderReviewPreview(record) {
        return `<section class='review-panel preview-paper'><p class='eyebrow'>公开页面预览</p>${renderReviewSnapshotContent(record)}</section>`;
      }

      function renderReviewAudit(record) {
        return `<section class='review-panel'><h2>操作记录</h2><ol class='audit-list'><li><strong>完成 Markdown 校验</strong><br>${record.updatedAt} · 系统</li><li><strong>导入草稿</strong><br>${record.updatedAt} · admin</li><li><strong>生成快照</strong><br>2026-07-16 10:30 · hk-value-snapshot</li></ol></section>`;
      }

      function renderReview() {
        const record = adminRecords.find((item) => item.id === state.selectedAdminRecord) || adminRecords[0];
        const report = validationReports[record.report];
        const hasErrors = report.errors.length > 0;
        const content = `
          <main class='admin-content' data-route="review">
            <button class='back-link review-back' type='button' data-action='admin-home'>← 返回快照管理</button>
            <section class='review-summary'><div><span class='status-pill status-pill--${record.status}'>${statusLabel(record.status)}</span><h1>${record.companyName} · ${record.ticker}</h1><p>${record.market} · 数据截至 ${record.dataAsOf}</p></div><div class='review-actions'>${record.status === 'published' ? `<button class='button button--danger' type='button' data-action='withdraw'>撤回</button>` : `<button class='button button--danger' type='button' data-action='delete-draft'>删除草稿</button><button class='button button--primary' type='button' data-action="publish" ${hasErrors ? 'disabled' : ''}>发布${hasErrors ? '（先修复错误）' : ''}</button>`}</div></section>
            <nav class='review-tabs' aria-label='审核内容'>${[['check', '检查'], ['preview', '预览'], ['audit', '记录']].map(([value, label]) => `<button class='review-tab ${state.reviewTab === value ? 'is-active' : ''}' type='button' data-action='review-tab' data-value='${value}'>${label}</button>`).join('')}</nav>
            <div class='admin-review-grid'>${renderReviewCheck(record, report)}${state.reviewTab === 'audit' ? renderReviewAudit(record) : renderReviewPreview(record)}</div>
          </main>`;
        return renderAdminShell(content);
      }

      function dialogCopy(kind, record) {
        if (kind === 'publish') return { title: '发布这份快照？', message: `${record.companyName} ${record.ticker} 将立即出现在公开网站。校验警告已经保留在记录中。`, confirm: '确认发布' };
        if (kind === 'withdraw') return { title: '撤回这份快照？', message: `${record.companyName} ${record.ticker} 将从公开网站隐藏，并回到草稿状态。`, confirm: '确认撤回' };
        return { title: '删除这份草稿？', message: `${record.companyName} ${record.ticker} 的草稿将从原型列表删除。`, confirm: '确认删除' };
      }

      function renderDialog() {
        if (!state.dialog) return '';
        const record = adminRecords.find((item) => item.id === state.dialog.recordId);
        const copy = dialogCopy(state.dialog.kind, record);
        return `<div class='dialog-backdrop'><section class='dialog' role="dialog" aria-modal="true" aria-labelledby='dialog-title'><h2 id='dialog-title'>${copy.title}</h2><p>${copy.message}</p><div class='dialog-actions'><button class='button' type='button' data-action='close-dialog' data-dialog-initial>取消</button><button class='button ${state.dialog.kind === 'publish' ? 'button--primary' : 'button--danger'}' type='button' data-action="confirm-dialog">${copy.confirm}</button></div></section></div>`;
      }

      function renderToast() {
        return `<div class='toast-region' aria-live="polite" aria-atomic='true'>${state.toast ? `<div class='toast toast--${state.toast.tone}'>${state.toast.message}</div>` : ''}</div>`;
      }

      function handleLogin(form) {
        const data = new FormData(form);
        const username = String(data.get('username') || '').trim();
        const password = String(data.get('password') || '');
        if (!username || !password) return setState({ loginError: '请输入用户名和密码。' });
        if (username !== 'admin' || password !== 'demo123') return setState({ loginError: '用户名或密码不正确。请使用页面上的演示账号。' });
        setState({ isAuthenticated: true, route: state.pendingRoute || 'admin-list', pendingRoute: null, loginError: null });
        showToast('已登录。');
      }

      function openDialog(kind) {
        lastDialogAction = document.activeElement?.getAttribute('data-action') || null;
        setState({ dialog: { kind, recordId: state.selectedAdminRecord } });
      }

      function closeDialog() {
        setState({ dialog: null });
        window.requestAnimationFrame(() => app.querySelector(`[data-action="${lastDialogAction}"]`)?.focus());
      }

      function showToast(message, tone = 'success') {
        window.clearTimeout(toastTimer);
        setState({ toast: { message, tone } });
        toastTimer = window.setTimeout(() => setState({ toast: null }), 2800);
      }

      function confirmWorkflow(kind, recordId) {
        const record = adminRecords.find((item) => item.id === recordId);
        if (kind === 'delete') {
          adminRecords = adminRecords.filter((item) => item.id !== recordId);
          setState({ dialog: null, route: 'admin-list' });
          showToast('草稿已删除。');
          return;
        }
        record.status = kind === 'publish' ? 'published' : 'withdrawn';
        record.updatedAt = '刚刚';
        setState({ dialog: null });
        showToast(kind === 'publish' ? '已发布。' : '已撤回。');
      }

      function setState(patch) {
        state = { ...state, ...patch };
        render();
      }

      function renderRoute() {
        if (state.route === 'home') return renderHome();
        if (state.route === 'snapshot') return renderSnapshot();
        if (state.route === 'login') return renderLogin();
        if (!state.isAuthenticated && ['admin-list', 'review'].includes(state.route)) return renderLogin();
        if (state.route === 'admin-list') return renderAdminList();
        if (state.route === 'review') return renderReview();
        return renderHome();
      }

      function render() {
        const mobileClass = state.viewportMode === 'mobile' ? 'is-mobile' : '';
        app.innerHTML = `
          <div class="prototype-frame">
            ${renderPrototypeBar()}
            <div class="prototype-stage ${mobileClass}">
              ${renderRoute()}
            </div>
            ${renderDialog()}
            ${renderToast()}
          </div>`;
        if (app.querySelector('.value-table-scroll')) window.requestAnimationFrame(() => app.querySelectorAll('.value-table-scroll').forEach((scroller) => { scroller.scrollLeft = scroller.scrollWidth; }));
        if (state.dialog) window.requestAnimationFrame(() => app.querySelector('[data-dialog-initial]')?.focus());
      }

      app.addEventListener('click', (event) => {
        const trigger = event.target.closest('[data-action]');
        if (!trigger) return;
        const action = trigger.dataset.action;
        const value = trigger.dataset.value;
        const id = trigger.dataset.id;
        if (action === 'prototype-route') {
          const route = trigger.dataset.route;
          const protectedRoute = ['admin-list', 'review'].includes(route);
          setState({ route: protectedRoute && !state.isAuthenticated ? 'login' : route, pendingRoute: protectedRoute && !state.isAuthenticated ? route : null, dialog: null, toast: null });
        }
        if (action === 'viewport') setState({ viewportMode: value });
        if (action === 'navigate-home' || action === 'back-results') setState({ route: 'home' });
        if (action === 'market') setState({ marketFilter: value, publicScenario: 'normal' });
        if (action === 'open-snapshot') setState({ route: 'snapshot', selectedSnapshot: id });
        if (action === 'select-version') setState({ selectedSnapshot: id });
        if (action === 'retry-public') setState({ publicScenario: 'normal' });
        if (action === 'clear-search') setState({ searchQuery: '', marketFilter: 'ALL', publicScenario: 'normal' });
        if (action === 'toggle-toc') setState({ tocOpen: !state.tocOpen });
        if (action === 'table-earliest' || action === 'table-latest') {
          const scroller = app.querySelector(`#${trigger.dataset.tableId}`);
          scroller?.scrollTo({ left: action === 'table-earliest' ? 0 : scroller.scrollWidth, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
        }
        if (action === 'logout') { setState({ isAuthenticated: false, route: 'login' }); showToast('已退出登录。'); }
        if (action === 'admin-home') setState({ route: 'admin-list', reviewTab: 'check' });
        if (action === 'open-upload') setState({ uploadOpen: true, inboxScanned: false });
        if (action === 'simulate-upload') { setState({ uploadOpen: true, selectedAdminRecord: 'draft-tencent' }); showToast('演示 Markdown 已导入为草稿。'); }
        if (action === 'scan-inbox') { setState({ inboxScanned: true, uploadOpen: true }); showToast('扫描完成：发现 1 个文件。'); }
        if (action === 'admin-filter') setState({ adminStatusFilter: value });
        if (action === 'review-snapshot') setState({ route: 'review', selectedAdminRecord: id, reviewTab: 'check' });
        if (action === 'review-tab') setState({ reviewTab: value });
        if (action === 'publish') openDialog('publish');
        if (action === 'withdraw') openDialog('withdraw');
        if (action === 'delete-draft') openDialog('delete');
        if (action === 'close-dialog') closeDialog();
        if (action === 'confirm-dialog' && state.dialog) confirmWorkflow(state.dialog.kind, state.dialog.recordId);
      });

      app.addEventListener('submit', (event) => {
        if (!event.target.matches('[data-action="search"]')) return;
        event.preventDefault();
        setState({ searchQuery: String(new FormData(event.target).get('q') || '').trim(), publicScenario: 'normal' });
      });

      app.addEventListener('submit', (event) => {
        if (!event.target.matches('[data-action="login"]')) return;
        event.preventDefault();
        handleLogin(event.target);
      });

      app.addEventListener('change', (event) => {
        if (event.target.matches('[data-action="sort"]')) setState({ sortMode: event.target.value });
        if (event.target.matches('[data-action="public-scenario"]')) setState({ publicScenario: event.target.value, route: 'home' });
        if (event.target.matches('[data-action="admin-market"]')) setState({ adminMarketFilter: event.target.value });
      });

      app.addEventListener('input', (event) => {
        if (event.target.matches('[data-action="admin-query"]')) setState({ adminQuery: event.target.value });
      });

      document.addEventListener('keydown', (event) => {
        if (!state.dialog) return;
        if (event.key === 'Escape') {
          event.preventDefault();
          closeDialog();
          return;
        }
        if (event.key !== 'Tab') return;
        const dialog = app.querySelector('[role="dialog"]');
        const focusable = [...dialog.querySelectorAll('button:not(:disabled), [href], input:not(:disabled), select:not(:disabled), [tabindex]:not([tabindex="-1"])')];
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });

      window.prototypeApp = {
        navigate(route) { setState({ route, dialog: null, toast: null }); },
        setViewport(viewportMode) { setState({ viewportMode }); },
        reset() { state = { ...initialState }; render(); }
      };

      render();
    })();
  </script>
</body>
</html>
