      border-radius: 4px;

      border-color: #2c819a;

      padding: 20px;

      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;

    .snapshot-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: var(--accent);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 160ms ease;

    .snapshot-toc { position: sticky; top: 72px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); }

    .version-list { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }

        scroll-behavior: auto !important;
        transition: none !important;
        animation: none !important;

    }

      function normalizeTicker(value, market) {
        const digits = value.trim().replace(/\D/g, '');
        if (!digits) return value.trim().toLowerCase();
        return market === 'HK' ? digits.padStart(5, '0') : digits.padStart(6, '0');
      }

      function filteredSnapshots() {
        if (state.publicScenario === 'empty') return [];
        const query = state.searchQuery.trim().toLowerCase();
        const records = snapshots.filter((snapshot) => snapshot.isLatest);
        const filtered = records.filter((snapshot) => {
          const marketMatches = state.marketFilter === 'ALL' || snapshot.market === state.marketFilter;
          if (!marketMatches) return false;
          if (!query) return true;
          const normalized = normalizeTicker(query, snapshot.market);
          return snapshot.companyName.toLowerCase().includes(query)
            || snapshot.ticker === normalized
            || snapshot.ticker.replace(/^0+/, '') === query.replace(/^0+/, '');
        });
        return [...filtered].sort((a, b) => {
          if (state.sortMode === 'published_desc') return b.publishedAt.localeCompare(a.publishedAt);
          if (state.sortMode === 'name_asc') return a.companyName.localeCompare(b.companyName, 'zh-CN');
          return b.dataAsOf.localeCompare(a.dataAsOf);
        });
      }

      function routeButton(route, label) {
        const active = state.route === route ? 'is-active' : '';
        return `<button class='${active}' type='button' data-action='prototype-route' data-route='${route}'>${label}</button>`;
      }

      function renderPrototypeBar() {
        return `
          <nav class='prototype-bar' aria-label='原型页面切换'>
            <span class='prototype-bar__label'>Prototype / 企业快照库</span>
            ${routeButton('home', '公开首页')}
            ${routeButton('snapshot', '快照详情')}
            ${routeButton('login', '后台登录')}
            ${routeButton('admin-list', '快照管理')}
            ${routeButton('review', '审核发布')}
            <select data-action='public-scenario' aria-label='公开页面状态'>
              <option value='normal' ${state.publicScenario === 'normal' ? 'selected' : ''}>正常状态</option>
              <option value='empty' ${state.publicScenario === 'empty' ? 'selected' : ''}>无结果</option>
              <option value='error' ${state.publicScenario === 'error' ? 'selected' : ''}>请求失败</option>
            </select>
            <button type='button' data-action='viewport' data-value='${state.viewportMode === 'mobile' ? 'desktop' : 'mobile'}'>${state.viewportMode === 'mobile' ? '恢复桌面' : '手机 390px'}</button>
          </nav>`;
      }

      function renderSiteHeader() {
        return `
          <header class='site-header'>
            <button class='brand' type='button' data-action='navigate-home'>
              <span class='brand-mark'>FS</span><span>企业快照库</span>
            </button>
            <nav class='site-nav' aria-label='公开导航'>
              <button type='button' data-action='navigate-home'>公司快照</button>
              <a href='#site-footer'>关于</a>
            </nav>
          </header>`;
      }

      function metricItems(snapshot) {
        const pairs = [['PE', snapshot.metrics.pe], ['PB', snapshot.metrics.pb], ['股息率', snapshot.metrics.dividend]];
        return pairs.map(([label, value]) => `<span class='mini-metric'><span>${label}</span> ${value}</span>`).join('');
      }

      function renderCard(snapshot) {
        const skip = snapshot.verdict === 'skip';
        return `
          <article class='snapshot-card'>
            <div class='card-meta'><span class='market-tag'>${snapshot.market === 'CN' ? 'A 股' : '港股'}</span><time>${snapshot.dataAsOf}</time></div>
            <h3>${snapshot.companyName}</h3>
            <span class='ticker'>${snapshot.ticker} · ${snapshot.exchange}</span>
            <p class='card-summary'>${snapshot.summary}</p>
            <div class='mini-metrics'>${metricItems(snapshot)}</div>
            <div class='card-footer'>
              <span class='verdict ${skip ? 'verdict--skip' : ''}'>${skip ? '暂不进入第二轮' : '进入第二轮研究'}</span>
              <button class='card-link' type='button' data-action="open-snapshot" data-id='${snapshot.id}'>查看 →</button>
            </div>
          </article>`;
      }

      function renderHomeResults() {
        if (state.publicScenario === 'error') {
          return `<div class='empty-state'><span class='empty-state__mark'>!</span><h3>快照列表没有加载成功</h3><p>演示中的请求被设为失败状态。恢复后可以继续查看公司快照。</p><button class='button button--primary' type='button' data-action='retry-public'>重新加载</button></div>`;
        }
        const results = filteredSnapshots();
        if (!results.length) {
          return `<div class='empty-state'><span class='empty-state__mark'>0</span><h3>没有找到符合条件的公司</h3><p>请尝试公司简称、证券代码，或清除市场筛选。</p><button class='button' type='button' data-action='clear-search'>清除筛选</button></div>`;
        }
        return results.map(renderCard).join('');
      }

      function renderHome() {
        const count = state.publicScenario === 'error' ? 0 : filteredSnapshots().length;
        return `
          <div class='site-shell' data-route="home">
            ${renderSiteHeader()}
            <main>
              <div class='page-wrap'>
                <section class='hero'>
                  <div>
                    <p class='eyebrow'>A 股 · 港股 / 财务快照</p>
                    <h1>先看事实，再决定是否继续研究。</h1>
                    <p class='hero-copy'>把公开财报整理成可以复查的企业快照。这里不预测股价，只保留数据、直接计算和需要继续验证的问题。</p>
                  </div>
                  <aside class='hero-note'>
                    <strong>阅读顺序</strong>
                    <p>入口检验 → 五步扫描 → 5 秒心算 → 五问清单 → 资料来源</p>
                  </aside>
                </section>
                <section class='search-panel' aria-label='搜索公司'>
                  <form class='search-form' data-action="search">
                    <input class='search-input' name='q' value='${escapeHtml(state.searchQuery)}' aria-label='公司名称或证券代码' placeholder='搜索公司名称或证券代码，例如 腾讯、00700'>
                    <button class='button button--primary' type='submit'>搜索公司</button>
                  </form>
                  <div class='filter-row'>
                    <div class='filter-group' aria-label='市场筛选'>
                      ${[['ALL', '全部'], ['CN', 'A 股'], ['HK', '港股']].map(([value, label]) => `<button class='filter-button ${state.marketFilter === value ? 'is-active' : ''}' type='button' data-action="market" data-value='${value}' aria-pressed='${state.marketFilter === value}'>${label}</button>`).join('')}
                    </div>
                    <select class='sort-control' data-action="sort" aria-label='结果排序'>
                      <option value='data_desc' ${state.sortMode === 'data_desc' ? 'selected' : ''}>数据日期</option>
                      <option value='published_desc' ${state.sortMode === 'published_desc' ? 'selected' : ''}>发布时间</option>
                      <option value='name_asc' ${state.sortMode === 'name_asc' ? 'selected' : ''}>公司名称</option>
                    </select>
                  </div>
                </section>
                <div class='result-header'><h2>${state.searchQuery ? `“${escapeHtml(state.searchQuery)}”的结果` : '最新快照'}</h2><span class='result-count'>${count} 家公司</span></div>
                <section class='snapshot-cards' aria-live='polite'>${renderHomeResults()}</section>
              </div>
            </main>
            ${renderFooter()}
          </div>`;
      }

      function evidenceLabel(kind) {
        return kind === 'fact' ? '事实' : kind === 'judgement' ? '判断' : kind === 'todo' ? '待验证' : '来源';
      }

      function renderResearchSection(section) {
        if (section.kind === 'source') {
          return `<section class='research-section' id='${section.id}'><h2>${section.title}</h2><ol class='source-list'><li>${section.body}</li><li>所有数据以公司正式披露为准，行情仅对应快照日期。</li></ol></section>`;
        }
        return `<section class='research-section' id='${section.id}'><h2>${section.title}</h2><div class='evidence-block evidence-block--${section.kind}'><span class='evidence-label'>${evidenceLabel(section.kind)}</span><p>${section.body}</p></div></section>`;
      }

      function renderSnapshot() {
        const snapshot = snapshots.find((item) => item.id === state.selectedSnapshot) || snapshots[0];
        const versions = snapshots.filter((item) => item.market === snapshot.market && item.ticker === snapshot.ticker);
        const skip = snapshot.verdict === 'skip';
        return `
          <div class='site-shell' data-route="snapshot">
            ${renderSiteHeader()}
            <main class='page-wrap snapshot-page'>
              <button class='back-link' type='button' data-action='back-results'>← 返回快照列表</button>
              <header class='snapshot-head'>
                <div class='snapshot-kicker'><span>${snapshot.market} · ${snapshot.exchange}</span><span>${snapshot.ticker}</span><span>数据截至 ${snapshot.dataAsOf}</span></div>
                <h1 class='snapshot-title'>${snapshot.companyName}</h1>
                <p class='snapshot-summary'>${snapshot.summary}</p>
              </header>
              <div class='metric-strip'>
                ${[['市盈率 TTM', snapshot.metrics.pe], ['市净率', snapshot.metrics.pb], ['股息率', snapshot.metrics.dividend], ['总市值', snapshot.metrics.marketCap]].map(([label, value]) => `<div class='metric'><span class='metric-label'>${label}</span><span class='metric-value'>${value}</span></div>`).join('')}
              </div>
              <div class='verdict-banner ${skip ? 'is-skip' : ''}'><div><strong>${skip ? '暂不进入第二轮研究' : '进入第二轮研究'}</strong><small>这是第一轮筛选结论，不是买卖建议。</small></div><span class='ticker'>生成于 ${snapshot.generatedAt}</span></div>
              <button class='button mobile-toc-toggle' type='button' data-action="toggle-toc">${state.tocOpen ? '收起目录' : '展开目录'}</button>
              <div class='scan-rail' aria-label="快照扫描轨">
                ${snapshot.sections.map((section, index) => `<div class='scan-step'><span class='scan-number'>0${index + 1}</span><span class='scan-label'>${section.title.replace(/^.+、/, '')}</span></div>`).join('')}
              </div>
              <div class='snapshot-grid'>
                <article class='snapshot-body'>${snapshot.sections.map(renderResearchSection).join('')}<div class='disclaimer'>内容基于公开资料整理，仅供研究参考，不构成投资建议。财务数据以公司正式披露为准。</div></article>
                <aside class='snapshot-toc ${state.tocOpen ? '' : 'desktop-toc'}'>
                  <h2>本页目录</h2>
                  ${snapshot.sections.map((section) => `<a href='#${section.id}'>${section.title}</a>`).join('')}
                  <div class='version-list'><h2>历史版本</h2>${versions.map((version) => `<button class='${version.id === snapshot.id ? 'is-active' : ''}' type='button' data-action="select-version" data-id='${version.id}'>${version.dataAsOf}</button>`).join('')}</div>
                </aside>
              </div>
            </main>
            ${renderFooter()}
          </div>`;
      }

      function renderFooter() {
        return `<footer class='site-footer' id='site-footer'><div class='site-footer__inner'><span>企业快照库 · 研究资料原型</span><span>公开资料，仅供研究参考</span></div></footer>`;
      }

      function renderPlaceholder(title) {
        return `<div class='site-shell'><div class='building-state'><p><strong>${title}</strong>将在下一阶段实现</p></div></div>`;
      }

      function setState(patch) {
        state = { ...state, ...patch };
        render();
      }

      function render() {
        const mobileClass = state.viewportMode === 'mobile' ? 'is-mobile' : '';
        app.innerHTML = `
          <div class="prototype-frame">
            ${renderPrototypeBar()}
            <div class="prototype-stage ${mobileClass}">
              ${state.route === 'home' ? renderHome() : state.route === 'snapshot' ? renderSnapshot() : renderPlaceholder('管理端')}
            </div>
          </div>`;
      }

      app.addEventListener('click', (event) => {
        const trigger = event.target.closest('[data-action]');
        if (!trigger) return;
        const action = trigger.dataset.action;
        const value = trigger.dataset.value;
        const id = trigger.dataset.id;
        if (action === 'prototype-route') setState({ route: trigger.dataset.route, dialog: null, toast: null });
        if (action === 'viewport') setState({ viewportMode: value });
        if (action === 'navigate-home' || action === 'back-results') setState({ route: 'home' });
        if (action === 'market') setState({ marketFilter: value, publicScenario: 'normal' });
        if (action === 'open-snapshot') setState({ route: 'snapshot', selectedSnapshot: id });
        if (action === 'select-version') setState({ selectedSnapshot: id });
        if (action === 'retry-public') setState({ publicScenario: 'normal' });
        if (action === 'clear-search') setState({ searchQuery: '', marketFilter: 'ALL', publicScenario: 'normal' });
        if (action === 'toggle-toc') setState({ tocOpen: !state.tocOpen });
      });

      app.addEventListener('submit', (event) => {
        if (!event.target.matches('[data-action="search"]')) return;
        event.preventDefault();
        setState({ searchQuery: String(new FormData(event.target).get('q') || '').trim(), publicScenario: 'normal' });
      });

      app.addEventListener('change', (event) => {
        if (event.target.matches('[data-action="sort"]')) setState({ sortMode: event.target.value });
        if (event.target.matches('[data-action="public-scenario"]')) setState({ publicScenario: event.target.value, route: 'home' });
      });

      window.prototypeApp = {
        navigate(route) { setState({ route, dialog: null, toast: null }); },
        setViewport(viewportMode) { setState({ viewportMode }); },
        reset() { state = { ...initialState }; render(); }
      };

      render();
    })();
  </script>
</body>
</html>
