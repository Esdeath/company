<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>企业快照库 · 交互原型</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f2f5f6;
      --surface: #ffffff;
      --ink: #17212b;
      --muted: #66727d;
      --line: #d7dee3;
      --accent: #155e75;
      --accent-soft: #e4f0f2;
      --positive: #2f6b4f;
      --positive-soft: #e6f0eb;
      --caution: #a15c16;
      --caution-soft: #f8ecdc;
      --negative: #a33a3a;
      --negative-soft: #f8e6e6;
      --radius-card: 8px;
      --radius-control: 6px;
      --shadow: 0 18px 55px rgba(23, 33, 43, 0.1);
      --font-display: "Iowan Old Style", "Songti SC", "STSong", serif;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-data: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: #dfe5e7;
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.6;
    }
    button, input, select { font: inherit; }
    button, a, select { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: 3px solid rgba(21, 94, 117, 0.35);
      outline-offset: 2px;
    }
    .prototype-frame { min-height: 100vh; }
    .prototype-stage {
      min-height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      background: var(--canvas);
      transition: width 180ms ease, box-shadow 180ms ease;
    }
    .prototype-stage.is-mobile {
      width: min(390px, 100%);
      box-shadow: var(--shadow);
    }
    .building-state {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      color: var(--muted);
    }
    .building-state strong {
      display: block;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: clamp(26px, 5vw, 48px);
      font-weight: 600;
    }
    .prototype-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 52px;
      padding: 8px 14px;
      overflow-x: auto;
      color: #f7fafb;
      background: #111a22;
      border-bottom: 1px solid #31404b;
      scrollbar-width: thin;
    }
    .prototype-bar__label {
      margin-right: auto;
      white-space: nowrap;
      font-family: var(--font-data);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .prototype-bar button, .prototype-bar select {
      min-height: 34px;
      padding: 6px 10px;
      white-space: nowrap;
      color: #dce6ea;
      background: #1c2832;
      border: 1px solid #40515e;
      border-radius: 4px;
      cursor: pointer;
    }
    .prototype-bar button:hover, .prototype-bar button.is-active {
      color: #fff;
      background: #155e75;
      border-color: #2c819a;
    }
    .site-shell { min-height: calc(100vh - 52px); }
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      padding: 0 24px;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 750;
      letter-spacing: -0.02em;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      color: #fff;
      background: var(--accent);
      border-radius: 50% 50% 50% 8px;
      font-family: var(--font-data);
      font-size: 11px;
    }
    .site-nav { display: flex; align-items: center; gap: 18px; }
    .site-nav a, .site-nav button {
      padding: 4px;
      color: var(--muted);
      background: transparent;
      border: 0;
      text-decoration: none;
      cursor: pointer;
    }
    .page-wrap { width: min(1180px, calc(100% - 48px)); margin: 0 auto; }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
      gap: 48px;
      padding: 72px 0 52px;
      border-bottom: 1px solid var(--line);
    }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-family: var(--font-data);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .hero h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.12;
    }
    .hero h1 { max-width: 760px; font-size: clamp(38px, 5.5vw, 72px); }
    .hero-copy { max-width: 640px; margin: 20px 0 0; color: var(--muted); font-size: 17px; }
    .hero-note {
      align-self: end;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-top: 3px solid var(--accent);
      border-radius: var(--radius-card);
    }
    .hero-note strong { display: block; margin-bottom: 6px; }
    .hero-note p { margin: 0; color: var(--muted); font-size: 14px; }
    .search-panel { padding: 28px 0 22px; }
    .search-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    .search-input {
      width: 100%;
      min-height: 50px;
      padding: 0 16px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid #aebbc1;
      border-radius: var(--radius-control);
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 42px;
      padding: 9px 16px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-control);
      text-decoration: none;
      cursor: pointer;
    }
    .button:hover { border-color: #9aabb3; }
    .button--primary { color: #fff; background: var(--accent); border-color: var(--accent); }
    .button--quiet { min-height: 34px; padding: 5px 10px; color: var(--muted); background: transparent; }
    .filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-top: 14px;
    }
    .filter-group { display: flex; flex-wrap: wrap; gap: 7px; }
    .filter-button {
      min-height: 34px;
      padding: 5px 12px;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 999px;
      cursor: pointer;
    }
    .filter-button.is-active { color: var(--accent); background: var(--accent-soft); border-color: #b8d4da; }
    .sort-control { min-height: 36px; padding: 5px 32px 5px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-control); }
    .result-header { display: flex; align-items: end; justify-content: space-between; gap: 16px; padding: 22px 0 14px; }
    .result-header h2 { margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 600; }
    .result-count { color: var(--muted); font-family: var(--font-data); font-size: 12px; }
    .snapshot-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding-bottom: 64px; }
    .snapshot-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 250px;
      padding: 20px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }
    .snapshot-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: var(--accent);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 160ms ease;
    }
    .snapshot-card:hover { transform: translateY(-2px); border-color: #b5c4ca; box-shadow: 0 14px 34px rgba(23, 33, 43, 0.08); }
    .snapshot-card:hover::before { transform: scaleY(1); }
    .card-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-family: var(--font-data); font-size: 11px; }
    .market-tag { padding: 2px 7px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; }
    .snapshot-card h3 { margin: 20px 0 7px; font-family: var(--font-display); font-size: 25px; font-weight: 600; line-height: 1.2; }
    .ticker { color: var(--muted); font-family: var(--font-data); font-size: 12px; }
    .card-summary { margin: 15px 0 18px; color: var(--muted); font-size: 14px; }
    .mini-metrics { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: auto; padding-top: 13px; border-top: 1px solid var(--line); }
    .mini-metric { font-family: var(--font-data); font-size: 11px; }
    .mini-metric span { color: var(--muted); }
    .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
    .verdict { display: inline-flex; align-items: center; gap: 6px; color: var(--positive); font-size: 12px; font-weight: 700; }
    .verdict::before { content: ""; width: 7px; height: 7px; background: currentColor; border-radius: 50%; }
    .verdict--skip { color: var(--caution); }
    .card-link { padding: 6px; color: var(--accent); background: transparent; border: 0; cursor: pointer; }
    .workspace-site-shell {
      display: flex;
      flex-direction: column;
      height: calc(100dvh - 52px);
      min-height: 620px;
      overflow: hidden;
    }
    .company-workspace {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .company-directory {
      z-index: 2;
      display: flex;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      background: #e8edef;
      border-right: 1px solid var(--line);
    }
    .company-directory__head { position: relative; padding: 20px 18px 14px; border-bottom: 1px solid var(--line); }
    .company-directory__title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .company-directory__title h1 { margin: 0; font-family: var(--font-display); font-size: 25px; font-weight: 600; }
    .company-directory__title span { color: var(--muted); font-family: var(--font-data); font-size: 11px; }
    .directory-search { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px; margin-top: 14px; }
    .directory-search .search-input { min-height: 42px; padding: 0 12px; }
    .directory-search .button { min-height: 42px; padding-inline: 12px; }
    .directory-filter { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
    .directory-filter .filter-group { flex-wrap: nowrap; gap: 2px; }
    .directory-filter .filter-button { padding-inline: 9px; }
    .directory-filter .sort-control { width: 88px; padding-right: 22px; }
    .company-directory__scroll { min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 12px; }
    .directory-card {
      position: relative;
      display: block;
      width: 100%;
      margin: 0 0 10px;
      padding: 16px;
      overflow: hidden;
      color: var(--ink);
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      cursor: pointer;
      transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
    }
    .directory-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: transparent; }
    .directory-card:hover { border-color: #9eafb7; }
    .directory-card.is-selected { background: #f7fbfc; border-color: #8fb8c3; box-shadow: 0 10px 28px rgba(23, 33, 43, 0.08); }
    .directory-card.is-selected::before { background: var(--accent); }
    .directory-card__current { color: var(--accent); font-size: 11px; font-weight: 750; }
    .directory-card h2 { margin: 13px 0 4px; font-family: var(--font-display); font-size: 22px; font-weight: 600; line-height: 1.2; }
    .directory-card .card-summary { display: -webkit-box; margin: 12px 0 14px; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
    .directory-card .card-footer { margin-top: 12px; }
    .file-kind { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .workspace-detail { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--canvas); container-name: workspace-detail; container-type: inline-size; }
    .workspace-context {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 64px;
      padding: 10px 24px;
      background: rgba(242, 245, 246, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .workspace-context__identity { min-width: 0; }
    .workspace-context__identity strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .workspace-context__identity span { color: var(--muted); font-family: var(--font-data); font-size: 11px; }
    .workspace-context__category { color: var(--accent); font-size: 12px; font-weight: 750; }
    .workspace-empty { display: grid; min-height: 100%; place-items: center; padding: 32px; }
    .workspace-empty .empty-state { width: min(560px, 100%); }
    .snapshot-frame-shell { position: relative; flex: 1; min-width: 0; min-height: 0; background: #fff; }
    .snapshot-frame-shell--review { min-height: 720px; border: 1px solid var(--line); border-radius: var(--radius-card); overflow: hidden; }
    .snapshot-frame-shell--standalone { height: calc(100dvh - 150px); min-height: calc(100dvh - 150px); }
    .snapshot-html-frame { display: block; width: 100%; height: 100%; min-height: 0; background: #f7f5f1; border: 0; }
    .snapshot-frame-shell--standalone .snapshot-html-frame { height: calc(100dvh - 150px); }
    .snapshot-frame-loading { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; color: var(--muted); background: #f7f5f1; font-size: 13px; }
    .snapshot-frame-loading.is-hidden { display: none; }
    .snapshot-frame-loading.is-error { color: var(--negative); background: var(--negative-soft); }
    .html-snapshot-main { display: flex; min-height: calc(100dvh - 116px); flex-direction: column; padding: 18px 24px 24px; }
    .company-drawer-button { display: none; }
    body.company-drawer-open { overflow: hidden; }
    .company-drawer-layer { position: fixed; inset: 52px 0 0; z-index: 45; display: none; }
    .company-drawer-backdrop { position: absolute; inset: 0; width: 100%; padding: 0; background: rgba(9, 18, 23, 0.52); border: 0; }
    .company-directory--drawer {
      position: relative;
      width: min(88vw, 340px);
      height: 100%;
      box-shadow: 18px 0 52px rgba(23, 33, 43, 0.24);
      animation: drawer-in 180ms ease-out;
    }
    .drawer-close { position: absolute; top: 13px; right: 12px; display: grid; width: 36px; height: 36px; place-items: center; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 50%; cursor: pointer; }
    @keyframes drawer-in { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    .empty-state {
      grid-column: 1 / -1;
      padding: 64px 24px;
      text-align: center;
      background: var(--surface);
      border: 1px dashed #aebbc1;
      border-radius: var(--radius-card);
    }
    .empty-state__mark { display: grid; place-items: center; width: 54px; height: 54px; margin: 0 auto 16px; color: var(--accent); background: var(--accent-soft); border-radius: 50%; font-family: var(--font-data); }
    .empty-state h3 { margin: 0; font-family: var(--font-display); font-size: 26px; }
    .empty-state p { margin: 8px auto 20px; max-width: 440px; color: var(--muted); }
    .back-link { display: inline-flex; align-items: center; gap: 6px; padding: 5px 0; color: var(--muted); background: transparent; border: 0; cursor: pointer; }
    .site-footer { padding: 26px 24px; color: var(--muted); background: #e6ebed; border-top: 1px solid var(--line); font-size: 12px; }
    .site-footer__inner { display: flex; justify-content: space-between; gap: 24px; width: min(1180px, 100%); margin: 0 auto; }
    .is-hidden { display: none !important; }
    .admin-surface { min-height: calc(100vh - 52px); background: #e9edef; }
    .login-page { min-height: calc(100vh - 52px); display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(380px, 0.9fr); }
    .login-context { display: flex; flex-direction: column; justify-content: space-between; padding: clamp(34px, 6vw, 84px); color: #e9f0f2; background: #17242d; }
    .login-context .brand { color: #fff; }
    .login-context h1 { max-width: 650px; margin: 80px 0 20px; font-family: var(--font-display); font-size: clamp(40px, 5vw, 68px); font-weight: 600; line-height: 1.08; }
    .login-context p { max-width: 560px; color: #aebdc4; }
    .login-context small { color: #7f929b; }
    .login-form-side { display: grid; place-items: center; padding: 32px; background: var(--canvas); }
    .login-card { width: min(420px, 100%); padding: 32px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); box-shadow: var(--shadow); }
    .login-card h2 { margin: 0; font-family: var(--font-display); font-size: 32px; font-weight: 600; }
    .login-card > p { margin: 8px 0 24px; color: var(--muted); }
    .form-field { display: grid; gap: 7px; margin-top: 16px; }
    .form-field label { font-size: 13px; font-weight: 700; }
    .form-field input { min-height: 44px; padding: 0 12px; border: 1px solid #aebbc1; border-radius: var(--radius-control); }
    .form-error { margin: 14px 0 0; padding: 10px 12px; color: var(--negative); background: var(--negative-soft); border-radius: var(--radius-control); font-size: 13px; }
    .demo-credential { margin-top: 18px; padding: 12px; color: var(--muted); background: #eef2f3; border-radius: var(--radius-control); font-family: var(--font-data); font-size: 12px; }
    .login-submit { width: 100%; margin-top: 20px; }
    .admin-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100vh - 52px); }
    .admin-sidebar { display: flex; flex-direction: column; padding: 22px 14px; color: #dfe8eb; background: #17242d; }
    .admin-sidebar .brand { margin: 0 8px 28px; color: #fff; }
    .admin-nav-button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; color: #afbec5; background: transparent; border: 0; border-radius: var(--radius-control); text-align: left; cursor: pointer; }
    .admin-nav-button.is-active { color: #fff; background: #23404d; }
    .admin-sidebar-footer { margin-top: auto; }
    .admin-main { min-width: 0; }
    .admin-topbar { display: flex; align-items: center; justify-content: space-between; min-height: 64px; padding: 0 28px; background: var(--surface); border-bottom: 1px solid var(--line); }
    .admin-topbar strong { font-size: 14px; }
    .admin-content { width: min(1180px, calc(100% - 48px)); margin: 0 auto; padding: 30px 0 64px; }
    .admin-heading { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
    .admin-heading h1 { margin: 0; font-family: var(--font-display); font-size: 36px; font-weight: 600; }
    .admin-heading p { margin: 4px 0 0; color: var(--muted); }
    .admin-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); }
    .admin-toolbar__group { display: flex; flex-wrap: wrap; gap: 7px; }
    .admin-search { min-height: 36px; padding: 5px 10px; border: 1px solid var(--line); border-radius: var(--radius-control); }
    .admin-panel { overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); }
    .admin-table { width: 100%; border-collapse: collapse; }
    .admin-table th, .admin-table td { padding: 13px 16px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    .admin-table th { color: var(--muted); background: #f7f9f9; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
    .admin-table tr:last-child td { border-bottom: 0; }
    .admin-table td { font-size: 13px; }
    .admin-table strong { display: block; font-size: 14px; }
    .status-pill { display: inline-flex; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .status-pill--draft { color: var(--caution); background: var(--caution-soft); }
    .status-pill--published { color: var(--positive); background: var(--positive-soft); }
    .status-pill--withdrawn { color: var(--muted); background: #e9edef; }
    .validation-count { display: flex; gap: 8px; font-family: var(--font-data); font-size: 11px; }
    .validation-count .has-error { color: var(--negative); }
    .validation-count .has-warning { color: var(--caution); }
    .admin-card-list { display: none; }
    .upload-panel { margin-bottom: 16px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); }
    .upload-drop { display: grid; place-items: center; min-height: 130px; padding: 20px; text-align: center; background: #f7f9f9; border: 1px dashed #9baab1; border-radius: var(--radius-control); }
    .upload-drop strong { display: block; }
    .upload-drop p { margin: 4px 0 12px; color: var(--muted); font-size: 13px; }
    .import-result { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
    .import-result > div { padding: 12px; border-radius: var(--radius-control); font-size: 12px; }
    .import-result strong { display: block; margin-bottom: 4px; }
    .report-error { color: var(--negative); background: var(--negative-soft); }
    .report-warning { color: var(--caution); background: var(--caution-soft); }
    .report-info { color: var(--accent); background: var(--accent-soft); }
    .review-back { margin-bottom: 14px; }

    "pageTitle": "价值线企业快照版 — 哔哩哔哩 (09626.HK) · 只寻找事实，不寻求意见",
    "status": "published",
    "report": "clean",

  }
]
</script>
  <script>
    (() => {
      function readEmbeddedJson(id) {
        return JSON.parse(document.querySelector(`#${id}`).textContent);
      }

      const htmlSnapshots = readEmbeddedJson('html-snapshot-manifest');

      let adminRecords = [
        { id: 'published-maotai-html', snapshotId: 'cn-600519-html', companyName: '贵州茅台', ticker: '600519', market: 'CN', dataAsOf: '2025-12-31', quoteAsOf: '2026-07-15 12:05', status: 'published', report: 'clean', updatedAt: '2026-07-16' },
        { id: 'published-bilibili-html', snapshotId: 'hk-09626-html', companyName: '哔哩哔哩', ticker: '09626', market: 'HK', dataAsOf: '2025-12-31', quoteAsOf: '2026-07-16 16:08:38', status: 'published', report: 'clean', updatedAt: '2026-07-17' },
        { id: 'demo-invalid-html', snapshotId: null, companyName: 'HTML 格式错误示例', ticker: '000000', market: 'CN', dataAsOf: '2025-12-31', quoteAsOf: null, fileName: '价值线_格式错误示例_企业快照版.html', pageTitle: '', status: 'draft', report: 'html-error', updatedAt: '今天 09:15' }
      ];

      const validationReports = {
        clean: { errors: [], warnings: [], info: ['完整 HTML、自包含资源和标题元数据校验通过。'] },
        'html-error': { errors: ['HTML 缺少非空 &lt;title&gt;。', 'HTML 包含远程 &lt;script&gt;，禁止发布。'], warnings: [], info: [] }
      };

      const initialState = Object.freeze({
        route: 'home',
        viewportMode: 'desktop',
        isAuthenticated: false,
        pendingRoute: null,
        loginError: null,
        searchQuery: '',
        marketFilter: 'ALL',
        sortMode: 'data_desc',
        selectedSnapshotId: 'cn-600519-html',
        companyDrawerOpen: false,
        publicScenario: 'normal',
        adminStatusFilter: 'all',
        adminMarketFilter: 'ALL',
        adminQuery: '',
        selectedAdminRecord: 'published-maotai-html',
        reviewTab: 'check',
        uploadOpen: false,
        inboxScanned: false,
        validationScenario: 'warning',
        dialog: null,
        toast: null
      });

      let state = { ...initialState };
      const app = document.querySelector('#app');
      let lastDialogAction = null;
      let toastTimer = null;

      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, (character) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        })[character]);
      }

      function normalizeTicker(value, market) {
        const digits = value.trim().replace(/\D/g, '');
        if (!digits) return value.trim().toLowerCase();
        return market === 'HK' ? digits.padStart(5, '0') : digits.padStart(6, '0');
      }

      function filteredSnapshots(sourceState = state) {
        if (sourceState.publicScenario === 'empty') return [];
        const query = sourceState.searchQuery.trim().toLowerCase();
        const records = htmlSnapshots.filter((snapshot) => snapshot.isLatest && snapshot.status === 'published');
        const filtered = records.filter((snapshot) => {
          const marketMatches = sourceState.marketFilter === 'ALL' || snapshot.market === sourceState.marketFilter;
          if (!marketMatches) return false;
          if (!query) return true;
          const normalized = normalizeTicker(query, snapshot.market);
          return snapshot.companyName.toLowerCase().includes(query)
            || snapshot.ticker === normalized
            || snapshot.ticker.replace(/^0+/, '') === query.replace(/^0+/, '');
        });
        return [...filtered].sort((a, b) => {
          if (sourceState.sortMode === 'published_desc') return b.publishedAt.localeCompare(a.publishedAt);
          if (sourceState.sortMode === 'name_asc') return a.companyName.localeCompare(b.companyName, 'zh-CN');
          return b.dataAsOf.localeCompare(a.dataAsOf);
        });
      }

      function selectedPublicSnapshot() {
        if (state.publicScenario !== 'normal') return null;
        return htmlSnapshots.find((snapshot) => snapshot.id === state.selectedSnapshotId && snapshot.status === 'published') || null;
      }

      function publicSelectionPatch(patch) {
        const nextState = { ...state, ...patch };
        const results = filteredSnapshots(nextState);
        let nextSelectedId = nextState.selectedSnapshotId;
        if (!results.some((snapshot) => snapshot.id === nextSelectedId)) {
          nextSelectedId = results[0]?.id || null;
        }
        return { ...patch, selectedSnapshotId: nextSelectedId };
      }

      function routeButton(route, label) {
        const active = state.route === route ? 'is-active' : '';
        return `<button class='${active}' type='button' data-action='prototype-route' data-route='${route}'>${label}</button>`;
      }

      function renderPrototypeBar() {
        return `
          <nav class='prototype-bar' aria-label='原型页面切换'>
            <span class='prototype-bar__label'>Prototype / 企业快照库</span>
            ${routeButton('home', '公开首页')}
            ${routeButton('snapshot', '快照详情')}
            ${routeButton('login', '后台登录')}
            ${routeButton('admin-list', '快照管理')}
            ${routeButton('review', '审核发布')}
            <select data-action='public-scenario' aria-label='公开页面状态'>
              <option value='normal' ${state.publicScenario === 'normal' ? 'selected' : ''}>正常状态</option>
              <option value='empty' ${state.publicScenario === 'empty' ? 'selected' : ''}>无结果</option>
              <option value='error' ${state.publicScenario === 'error' ? 'selected' : ''}>请求失败</option>
            </select>
            <button type='button' data-action="viewport" data-value='${state.viewportMode === 'mobile' ? 'desktop' : 'mobile'}'>${state.viewportMode === 'mobile' ? '恢复桌面' : '手机 390px'}</button>
          </nav>`;
      }

      function renderSiteHeader() {
        return `
          <header class='site-header'>
            <button class='brand' type='button' data-action='navigate-home'>
              <span class='brand-mark'>FS</span><span>企业快照库</span>
            </button>
            <nav class='site-nav' aria-label='公开导航'>
              <button type='button' data-action='navigate-home'>公司快照</button>
              <a href='#site-footer'>关于</a>
            </nav>
          </header>`;
      }

      function renderCompanyCard(snapshot, selected) {
        return `
          <button class='directory-card ${selected ? 'is-selected' : ''}' type='button' data-action="select-company" data-id='${snapshot.id}' aria-current='${selected ? 'true' : 'false'}'>
            <div class='card-meta'><span class='market-tag'>${snapshot.market === 'CN' ? 'A 股' : '港股'}</span><time>${snapshot.dataAsOf}</time></div>
            <h2>${escapeHtml(snapshot.companyName)}</h2>
            <span class='ticker'>${escapeHtml(snapshot.ticker)} · ${escapeHtml(snapshot.exchange)}</span>
            <div class='file-kind'><span>HTML 快照</span><span class='status-pill status-pill--published'>已发布</span></div>
            <div class='card-footer'>${selected ? `<span class='directory-card__current'>当前阅读</span>` : `<span class='ticker'>点击阅读原始页面</span>`}</div>
          </button>`;
      }

      function renderDirectoryResults() {
        if (state.publicScenario === 'error') {
          return `<div class='empty-state'><span class='empty-state__mark'>!</span><h3>公司目录没有加载成功</h3><p>恢复后可以继续查看公司快照。</p><button class='button button--primary' type='button' data-action='retry-public'>重新加载</button></div>`;
        }
        const results = filteredSnapshots();
        if (!results.length) {
          return `<div class='empty-state'><span class='empty-state__mark'>0</span><h3>没有找到公司</h3><p>尝试公司简称、证券代码，或清除市场筛选。</p><button class='button' type='button' data-action='clear-search'>清除筛选</button></div>`;
        }
        return results.map((snapshot) => renderCompanyCard(snapshot, snapshot.id === state.selectedSnapshotId)).join('');
      }

      function renderCompanyDirectory({ drawer = false } = {}) {
        const count = state.publicScenario === 'error' ? 0 : filteredSnapshots().length;
        return `
          <aside class='company-directory ${drawer ? 'company-directory--drawer' : ''}' aria-label='公司目录' ${drawer ? `role='dialog' aria-modal='true' aria-labelledby='company-drawer-title'` : ''}>
            <div class='company-directory__head'>
              <div class='company-directory__title'><h1 id='${drawer ? 'company-drawer-title' : 'company-directory-title'}'>公司目录</h1><span>${count} 家公司</span></div>
              ${drawer ? `<button class='drawer-close' type='button' data-action="close-company-drawer" data-drawer-initial aria-label='关闭公司列表'>×</button>` : ''}
              <form class='directory-search' data-action="search"><input class='search-input' name='q' value='${escapeHtml(state.searchQuery)}' aria-label='公司名称或证券代码' placeholder='公司名称或代码'><button class='button button--primary' type='submit'>搜索</button></form>
              <div class='directory-filter'>
                <div class='filter-group' aria-label='市场筛选'>${[['ALL', '全部'], ['CN', 'A 股'], ['HK', '港股']].map(([value, label]) => `<button class='filter-button ${state.marketFilter === value ? 'is-active' : ''}' type='button' data-action="market" data-value='${value}' aria-pressed='${state.marketFilter === value}'>${label}</button>`).join('')}</div>
                <select class='sort-control' data-action="sort" aria-label='结果排序'><option value='data_desc' ${state.sortMode === 'data_desc' ? 'selected' : ''}>日期</option><option value='published_desc' ${state.sortMode === 'published_desc' ? 'selected' : ''}>发布</option><option value='name_asc' ${state.sortMode === 'name_asc' ? 'selected' : ''}>名称</option></select>
              </div>
            </div>
            <div class='company-directory__scroll' aria-live='polite'>${renderDirectoryResults()}</div>
          </aside>`;
      }


      function renderInvalidHtmlPreview() {
        return `<div class='empty-state'><span class='empty-state__mark'>!</span><h3>无法生成 HTML 预览</h3><p>HTML 校验失败，无法生成预览。请补全页面标题并移除远程脚本。</p></div>`;
      }

      function renderSnapshotFrame(snapshot, mode) {
        if (!snapshot?.htmlPath) return renderInvalidHtmlPreview();
        return `
          <div class='snapshot-frame-shell snapshot-frame-shell--${mode}'>
            <div class='snapshot-frame-loading' data-frame-loading>正在加载 HTML 快照</div>
            <iframe class='snapshot-html-frame' src='${escapeHtml(snapshot.htmlPath)}' title='${escapeHtml(snapshot.companyName)}企业财报快照' sandbox data-frame-load></iframe>
          </div>`;
      }

      function renderWorkspaceDetail(snapshot) {
        if (!snapshot) return `<section class='workspace-detail workspace-empty'><div class='empty-state'><span class='empty-state__mark'>0</span><h3>没有可阅读的企业财报 HTML</h3><p>请调整公司名称或市场条件。</p><button class='button' type='button' data-action='clear-search'>清除筛选</button></div></section>`;
        return `
          <section class='workspace-detail'>
            <div class='workspace-context'><button class='button company-drawer-button' type='button' data-action="open-company-drawer" aria-haspopup='dialog'>选择公司</button><div class='workspace-context__identity'><strong>${escapeHtml(snapshot.companyName)}</strong><span>${escapeHtml(snapshot.ticker)} · ${snapshot.market === 'CN' ? 'A 股' : '港股'}</span></div><span class='workspace-context__category'>企业财报 HTML</span></div>
            ${renderSnapshotFrame(snapshot, 'public')}
          </section>`;
      }

      function renderCompanyWorkspace() {
        return `
          <div class='site-shell workspace-site-shell' data-route="home">
            ${renderSiteHeader()}
            <main class='company-workspace'>${renderCompanyDirectory()}${renderWorkspaceDetail(selectedPublicSnapshot())}</main>
            ${state.companyDrawerOpen ? `<div class='company-drawer-layer'><button class='company-drawer-backdrop' type='button' data-action="close-company-drawer" aria-label='关闭公司列表'></button>${renderCompanyDirectory({ drawer: true })}</div>` : ''}
          </div>`;
      }

      function renderHome() {
        return renderCompanyWorkspace();
      }


      function renderHtmlSnapshotPage(snapshot) {
        return `<div class='site-shell html-snapshot-page' data-route="snapshot">${renderSiteHeader()}<main class='html-snapshot-main'><button class='back-link' type='button' data-action='back-results'>← 返回公司目录</button>${renderSnapshotFrame(snapshot, 'standalone')}</main></div>`;
      }

      function renderSnapshot() {
        return renderHtmlSnapshotPage(selectedPublicSnapshot() || htmlSnapshots[0]);
      }

      function renderFooter() {
        return `<footer class='site-footer' id='site-footer'><div class='site-footer__inner'><span>企业快照库 · 研究资料原型</span><span>公开资料，仅供研究参考</span></div></footer>`;
      }

      function renderPlaceholder(title) {
        return `<div class='site-shell'><div class='building-state'><p><strong>${title}</strong>将在下一阶段实现</p></div></div>`;
      }

      function renderLogin() {
        return `
          <main class='login-page' data-route="login">
            <section class='login-context'>
              <div class='brand'><span class='brand-mark'>FS</span><span>企业快照库</span></div>
              <div><p class='eyebrow'>ADMIN / 内容审核</p><h1>让发布动作慢下来，让资料更可信。</h1><p>管理端只处理 HTML 导入、校验、预览和发布。正文需要修改时，回到 Skill 重新生成。</p></div>
              <small>Prototype · 本页账号仅用于交互演示</small>
            </section>
            <section class='login-form-side'>
              <form class='login-card' data-action="login">
                <h2>管理员登录</h2><p>登录后查看草稿和校验结果。</p>
                <div class='form-field'><label for='username'>用户名</label><input id='username' name='username' autocomplete='username' value='admin'></div>
                <div class='form-field'><label for='password'>密码</label><input id='password' name='password' type='password' autocomplete='current-password' value='demo123'></div>
                ${state.loginError ? `<p class='form-error' role='alert'>${state.loginError}</p>` : ''}
                <button class='button button--primary login-submit' type='submit'>登录</button>
                <div class='demo-credential'>演示账号：admin<br>演示密码：demo123</div>
              </form>
            </section>
          </main>`;
      }

      function renderAdminSidebar(active) {
        return `
          <aside class='admin-sidebar'>
            <div class='brand'><span class='brand-mark'>FS</span><span>快照管理</span></div>
            <nav aria-label='管理导航'>
              <button class='admin-nav-button ${active === 'snapshots' ? 'is-active' : ''}' type='button' data-action='admin-home'>▦ 快照管理</button>
            </nav>
            <div class='admin-sidebar-footer'><button class='admin-nav-button' type='button' data-action='logout'>↩ 退出登录</button></div>
          </aside>`;
      }

      function renderAdminShell(content, active = 'snapshots') {
        return `
          <div class='admin-surface'>
            <div class='admin-layout'>
              ${renderAdminSidebar(active)}
              <div class='admin-main'><header class='admin-topbar'><strong>企业快照库 · 管理端</strong><span class='ticker'>admin</span></header>${content}</div>
            </div>
          </div>`;
      }

      function statusLabel(status) {
        return status === 'draft' ? '草稿' : status === 'published' ? '已发布' : '已撤回';
      }

      function reportCounts(reportName) {
        const report = validationReports[reportName];
        return `<div class='validation-count'><span class='${report.errors.length ? 'has-error' : ''}'>${report.errors.length} 错误</span><span class='${report.warnings.length ? 'has-warning' : ''}'>${report.warnings.length} 警告</span></div>`;
      }

      function filteredAdminRecords() {
        const query = state.adminQuery.trim().toLowerCase();
        return adminRecords.filter((record) => {
          const statusMatches = state.adminStatusFilter === 'all' || record.status === state.adminStatusFilter;
          const marketMatches = state.adminMarketFilter === 'ALL' || record.market === state.adminMarketFilter;
          const queryMatches = !query || record.companyName.toLowerCase().includes(query) || record.ticker.includes(query);
          return statusMatches && marketMatches && queryMatches;
        });
      }

      function renderUploadPanel() {
        if (!state.uploadOpen && !state.inboxScanned) return '';
        const report = validationReports['html-error'];
        return `
          <section class='upload-panel'>
            <div class='upload-drop'>
              <div><strong>${state.inboxScanned ? '扫描 inbox 中的企业快照 HTML' : '选择一份 HTML 快照'}</strong><p>${state.inboxScanned ? '扫描完成：发现 2 个 HTML 文件。' : '原型使用内置的 HTML 格式错误演示文件，不读取你的本地文件。'}</p><button class='button button--primary' type='button' data-action="simulate-upload">使用演示 HTML</button></div>
            </div>
            ${state.uploadOpen ? `<div class='import-result'><div class='report-error'><strong>校验错误</strong>${report.errors.length ? report.errors.join('；') : '无'}</div><div class='report-warning'><strong>校验警告</strong>${report.warnings.length ? report.warnings.join('；') : '无'}</div><div class='report-info'><strong>标准化信息</strong>${report.info.length ? report.info.join('；') : '无'}</div></div>` : ''}
          </section>`;
      }

      function renderAdminRows(records) {
        if (!records.length) return `<tr><td colspan='7'><div class='empty-state'><h3>没有符合条件的快照</h3><p>调整状态、市场或搜索关键词。</p></div></td></tr>`;
        return records.map((record) => `
          <tr>
            <td><strong>${record.companyName}</strong><span class='ticker'>${record.ticker}</span></td><td>${record.market}</td><td>${record.dataAsOf}</td>
            <td><span class='status-pill status-pill--${record.status}'>${statusLabel(record.status)}</span></td><td>${reportCounts(record.report)}</td><td>${record.updatedAt}</td>
            <td><button class='button button--quiet' type='button' data-action="review-snapshot" data-id='${record.id}'>审核</button></td>
          </tr>`).join('');
      }

      function renderAdminCards(records) {
        return records.map((record) => `<article class='snapshot-card'><div class='card-meta'><span class='status-pill status-pill--${record.status}'>${statusLabel(record.status)}</span><span>${record.market}</span></div><h3>${record.companyName}</h3><span class='ticker'>${record.ticker} · ${record.dataAsOf}</span><div class='card-footer'>${reportCounts(record.report)}<button class='button button--quiet' type='button' data-action="review-snapshot" data-id='${record.id}'>审核</button></div></article>`).join('');
      }

      function renderAdminList() {
        const records = filteredAdminRecords();
        const content = `
          <main class='admin-content' data-route="admin-list">
            <div class='admin-heading'><div><h1>快照管理</h1><p>导入 HTML，检查文件，再决定是否发布。</p></div><div class='review-actions'><button class='button' type='button' data-action="scan-inbox">扫描 inbox 中的企业快照 HTML</button><button class='button button--primary' type='button' data-action='open-upload'>上传 HTML</button></div></div>
            ${renderUploadPanel()}
            <div class='admin-toolbar'>
              <div class='admin-toolbar__group'>${[['all', '全部'], ['draft', '草稿'], ['published', '已发布'], ['withdrawn', '已撤回']].map(([value, label]) => `<button class='filter-button ${state.adminStatusFilter === value ? 'is-active' : ''}' type='button' data-action='admin-filter' data-value='${value}'>${label}</button>`).join('')}</div>
              <div class='admin-toolbar__group'><select class='sort-control' data-action='admin-market' aria-label='管理市场筛选'><option value='ALL'>全部市场</option><option value='CN' ${state.adminMarketFilter === 'CN' ? 'selected' : ''}>A 股</option><option value='HK' ${state.adminMarketFilter === 'HK' ? 'selected' : ''}>港股</option></select><input class='admin-search' value='${escapeHtml(state.adminQuery)}' data-action='admin-query' aria-label='搜索管理快照' placeholder='公司或代码'></div>
            </div>
            <div class='admin-panel'><table class='admin-table'><thead><tr><th>公司</th><th>市场</th><th>数据日期</th><th>状态</th><th>校验</th><th>更新</th><th>操作</th></tr></thead><tbody>${renderAdminRows(records)}</tbody></table><div class='admin-card-list'>${renderAdminCards(records)}</div></div>
          </main>`;
        return renderAdminShell(content);
      }

      function renderValidationList(title, items, tone, emptyText) {
        return `<div class='validation-group ${tone}'><h3>${title}</h3>${items.length ? `<ul>${items.map((item) => `<li>${item}</li>`).join('')}</ul>` : `<p class='ticker'>${emptyText}</p>`}</div>`;
      }

      function snapshotForRecord(record) {
        return htmlSnapshots.find((snapshot) => snapshot.id === record.snapshotId) || null;
      }

      function renderReviewCheck(record, report) {
        const snapshot = snapshotForRecord(record);
        const fileName = snapshot?.fileName || record.fileName;
        const pageTitle = snapshot?.pageTitle || record.pageTitle || '无法识别';
        return `<section class='review-panel'><h2>元数据</h2><dl class='metadata-list'><dt>公司</dt><dd>${escapeHtml(record.companyName)}</dd><dt>代码</dt><dd>${escapeHtml(record.ticker)}</dd><dt>市场</dt><dd>${escapeHtml(record.market)}</dd><dt>数据日期</dt><dd>${escapeHtml(record.dataAsOf)}</dd>${record.quoteAsOf ? `<dt>行情时间</dt><dd>${escapeHtml(record.quoteAsOf)}</dd>` : ''}<dt>HTML 文件</dt><dd>${escapeHtml(fileName)}</dd><dt>页面标题</dt><dd>${escapeHtml(pageTitle)}</dd><dt>文件类型</dt><dd>text/html</dd></dl>${renderValidationList('校验错误', report.errors, 'report-error', '没有错误')}${renderValidationList('校验警告', report.warnings, 'report-warning', '没有警告')}${renderValidationList('标准化信息', report.info, 'report-info', '没有标准化信息')}</section>`;
      }

      function renderReviewSnapshotContent(record) {
        if (!record.snapshotId) return renderInvalidHtmlPreview();
        const snapshot = snapshotForRecord(record);
        return renderSnapshotFrame(snapshot, 'review');
      }

      function renderReviewPreview(record) {
        return `<section class='review-panel preview-paper'><p class='eyebrow'>公开页面预览</p>${renderReviewSnapshotContent(record)}</section>`;
      }

      function renderReviewAudit(record) {
        return `<section class='review-panel'><h2>操作记录</h2><ol class='audit-list'><li><strong>完成 HTML 校验</strong><br>${record.updatedAt} · 系统</li><li><strong>导入 HTML 草稿</strong><br>${record.updatedAt} · admin</li><li><strong>生成快照</strong><br>2026-07-16 10:30 · 企业快照 Skill</li></ol></section>`;
      }

      function renderReview() {
        const record = adminRecords.find((item) => item.id === state.selectedAdminRecord) || adminRecords[0];
        const report = validationReports[record.report];
        const hasErrors = report.errors.length > 0;
        const content = `
          <main class='admin-content' data-route="review">
            <button class='back-link review-back' type='button' data-action='admin-home'>← 返回快照管理</button>
            <section class='review-summary'><div><span class='status-pill status-pill--${record.status}'>${statusLabel(record.status)}</span><h1>${record.companyName} · ${record.ticker}</h1><p>${record.market} · 数据截至 ${record.dataAsOf}</p></div><div class='review-actions'>${record.status === 'published' ? `<button class='button button--danger' type='button' data-action='withdraw'>撤回</button>` : `<button class='button button--danger' type='button' data-action='delete-draft'>删除草稿</button><button class='button button--primary' type='button' data-action="publish" ${hasErrors ? 'disabled' : ''}>发布${hasErrors ? '（先修复错误）' : ''}</button>`}</div></section>
            <nav class='review-tabs' aria-label='审核内容'>${[['check', '检查'], ['preview', '预览'], ['audit', '记录']].map(([value, label]) => `<button class='review-tab ${state.reviewTab === value ? 'is-active' : ''}' type='button' data-action='review-tab' data-value='${value}'>${label}</button>`).join('')}</nav>
            <div class='admin-review-grid'>${renderReviewCheck(record, report)}${state.reviewTab === 'audit' ? renderReviewAudit(record) : renderReviewPreview(record)}</div>
          </main>`;
        return renderAdminShell(content);
      }

      function dialogCopy(kind, record) {
        if (kind === 'publish') return { title: '发布这份快照？', message: `${record.companyName} ${record.ticker} 将立即出现在公开网站。校验警告已经保留在记录中。`, confirm: '确认发布' };
        if (kind === 'withdraw') return { title: '撤回这份快照？', message: `${record.companyName} ${record.ticker} 将从公开网站隐藏，并回到草稿状态。`, confirm: '确认撤回' };
        return { title: '删除这份草稿？', message: `${record.companyName} ${record.ticker} 的草稿将从原型列表删除。`, confirm: '确认删除' };
      }

      function renderDialog() {
        if (!state.dialog) return '';
        const record = adminRecords.find((item) => item.id === state.dialog.recordId);
        const copy = dialogCopy(state.dialog.kind, record);
        return `<div class='dialog-backdrop'><section class='dialog' role="dialog" aria-modal="true" aria-labelledby='dialog-title'><h2 id='dialog-title'>${copy.title}</h2><p>${copy.message}</p><div class='dialog-actions'><button class='button' type='button' data-action='close-dialog' data-dialog-initial>取消</button><button class='button ${state.dialog.kind === 'publish' ? 'button--primary' : 'button--danger'}' type='button' data-action="confirm-dialog">${copy.confirm}</button></div></section></div>`;
      }

      function renderToast() {
        return `<div class='toast-region' aria-live="polite" aria-atomic='true'>${state.toast ? `<div class='toast toast--${state.toast.tone}'>${state.toast.message}</div>` : ''}</div>`;
      }

      function handleLogin(form) {
        const data = new FormData(form);
        const username = String(data.get('username') || '').trim();
        const password = String(data.get('password') || '');
        if (!username || !password) return setState({ loginError: '请输入用户名和密码。' });
        if (username !== 'admin' || password !== 'demo123') return setState({ loginError: '用户名或密码不正确。请使用页面上的演示账号。' });
        setState({ isAuthenticated: true, route: state.pendingRoute || 'admin-list', pendingRoute: null, loginError: null });
        showToast('已登录。');
      }

      function openDialog(kind) {
        lastDialogAction = document.activeElement?.getAttribute('data-action') || null;
        setState({ dialog: { kind, recordId: state.selectedAdminRecord } });
      }

      function closeDialog() {
        setState({ dialog: null });
        window.requestAnimationFrame(() => app.querySelector(`[data-action="${lastDialogAction}"]`)?.focus());
      }

      function showToast(message, tone = 'success') {
        window.clearTimeout(toastTimer);
        setState({ toast: { message, tone } });
        toastTimer = window.setTimeout(() => setState({ toast: null }), 2800);
      }

      function confirmWorkflow(kind, recordId) {
        const record = adminRecords.find((item) => item.id === recordId);
        if (kind === 'delete') {
          adminRecords = adminRecords.filter((item) => item.id !== recordId);
          setState({ dialog: null, route: 'admin-list' });
          showToast('草稿已删除。');
          return;
        }
        record.status = kind === 'publish' ? 'published' : 'withdrawn';
        record.updatedAt = '刚刚';
        setState({ dialog: null });
        showToast(kind === 'publish' ? '已发布。' : '已撤回。');
      }

      function trapFocus(container, event) {
        const focusable = [...container.querySelectorAll('button:not(:disabled), [href], input:not(:disabled), select:not(:disabled), [tabindex]:not([tabindex="-1"])')];
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }

      function openCompanyDrawer() {
        setState({ companyDrawerOpen: true });
        window.requestAnimationFrame(() => app.querySelector('[data-drawer-initial]')?.focus());
      }

      function closeCompanyDrawer({ restoreFocus = true } = {}) {
        setState({ companyDrawerOpen: false });
        if (restoreFocus) window.requestAnimationFrame(() => app.querySelector('[data-action="open-company-drawer"]')?.focus());
      }

      function setState(patch) {
        state = { ...state, ...patch };
        render();
      }

      function snapshotFrameLoading(frame) {
        return frame.closest('.snapshot-frame-shell')?.querySelector('[data-frame-loading]');
      }

      function showSnapshotFrameError(frame) {
        const loading = snapshotFrameLoading(frame);
        if (!loading?.isConnected) return;
        loading.textContent = 'HTML 快照未能加载，请检查文件路径';
        loading.classList.remove('is-hidden');
        loading.classList.add('is-error');
      }

      function completeSnapshotFrameLoad(frame) {
        const isLocalFile = window.location.protocol === 'file:';
        const httpLoadComplete = frame.dataset.frameHttpStatus === 'ok' && frame.dataset.frameLoadStatus === 'loaded';
        if (!isLocalFile && !httpLoadComplete) return;
        snapshotFrameLoading(frame)?.classList.add('is-hidden');
      }

      async function preflightSnapshotFrame(frame) {
        if (!['http:', 'https:'].includes(window.location.protocol)) return;
        try {
          const url = new URL(frame.src, window.location.href);
          if (url.origin !== window.location.origin) throw new Error('Snapshot frame must be same-origin');
          const response = await fetch(frame.src, { method: 'HEAD', credentials: 'same-origin' });
          if (!response.ok) throw new Error(`Snapshot preflight failed: ${response.status}`);
          frame.dataset.frameHttpStatus = 'ok';
          completeSnapshotFrameLoad(frame);
        } catch (error) {
          frame.dataset.frameHttpStatus = 'error';
          showSnapshotFrameError(frame);
        }
      }

      function armSnapshotFrameTimeouts() {
        app.querySelectorAll('[data-frame-load]').forEach((frame) => {
          preflightSnapshotFrame(frame);
          window.setTimeout(() => {
            const loading = snapshotFrameLoading(frame);
            if (!loading?.isConnected || loading.classList.contains('is-hidden')) return;
            showSnapshotFrameError(frame);
          }, 3500);
        });
      }

      function renderRoute() {
        if (state.route === 'home') return renderHome();
        if (state.route === 'snapshot') return renderSnapshot();
        if (state.route === 'login') return renderLogin();
        if (!state.isAuthenticated && ['admin-list', 'review'].includes(state.route)) return renderLogin();
        if (state.route === 'admin-list') return renderAdminList();
        if (state.route === 'review') return renderReview();
        return renderHome();
      }

      function render() {
        const mobileClass = state.viewportMode === 'mobile' ? 'is-mobile' : '';
        app.innerHTML = `
          <div class="prototype-frame">
            ${renderPrototypeBar()}
            <div class="prototype-stage ${mobileClass}">
              ${renderRoute()}
            </div>
            ${renderDialog()}
              ${renderToast()}
            </div>`;
        armSnapshotFrameTimeouts();
        document.body.classList.toggle('company-drawer-open', state.companyDrawerOpen);
        if (state.dialog) window.requestAnimationFrame(() => app.querySelector('[data-dialog-initial]')?.focus());
      }

      app.addEventListener('load', (event) => {
        const frame = event.target;
        if (!frame.matches('[data-frame-load]')) return;
        frame.dataset.frameLoadStatus = 'loaded';
        completeSnapshotFrameLoad(frame);
      }, true);

      app.addEventListener('click', (event) => {
        const trigger = event.target.closest('[data-action]');
        if (!trigger) return;
        const action = trigger.dataset.action;
        const value = trigger.dataset.value;
        const id = trigger.dataset.id;
        if (action === 'prototype-route') {
          const route = trigger.dataset.route;
          const protectedRoute = ['admin-list', 'review'].includes(route);
          setState({ route: protectedRoute && !state.isAuthenticated ? 'login' : route, pendingRoute: protectedRoute && !state.isAuthenticated ? route : null, dialog: null, toast: null });
        }
        if (action === 'viewport') setState({ viewportMode: value });
        if (action === 'navigate-home' || action === 'back-results') setState({ route: 'home' });
        if (action === 'market') setState(publicSelectionPatch({ marketFilter: value, publicScenario: 'normal' }));
        if (action === 'select-company') {
          const wasDrawerOpen = state.companyDrawerOpen;
          setState({ selectedSnapshotId: id, companyDrawerOpen: false });
          if (wasDrawerOpen) window.requestAnimationFrame(() => app.querySelector('[data-action="open-company-drawer"]')?.focus());
        }
        if (action === 'open-company-drawer') openCompanyDrawer();
        if (action === 'close-company-drawer') closeCompanyDrawer();
        if (action === 'retry-public') setState(publicSelectionPatch({ publicScenario: 'normal' }));
        if (action === 'clear-search') setState(publicSelectionPatch({ searchQuery: '', marketFilter: 'ALL', publicScenario: 'normal' }));
        if (action === 'logout') { setState({ isAuthenticated: false, route: 'login' }); showToast('已退出登录。'); }
        if (action === 'admin-home') setState({ route: 'admin-list', reviewTab: 'check' });
        if (action === 'open-upload') setState({ uploadOpen: true, inboxScanned: false });
        if (action === 'simulate-upload') { setState({ uploadOpen: true, selectedAdminRecord: 'demo-invalid-html' }); showToast('演示 HTML 已导入为草稿。'); }
        if (action === 'scan-inbox') { setState({ inboxScanned: true, uploadOpen: true }); showToast('扫描完成：发现 2 个 HTML 文件。'); }
        if (action === 'admin-filter') setState({ adminStatusFilter: value });
        if (action === 'review-snapshot') setState({ route: 'review', selectedAdminRecord: id, reviewTab: 'check' });
        if (action === 'review-tab') setState({ reviewTab: value });
        if (action === 'publish') openDialog('publish');
        if (action === 'withdraw') openDialog('withdraw');
        if (action === 'delete-draft') openDialog('delete');
        if (action === 'close-dialog') closeDialog();
        if (action === 'confirm-dialog' && state.dialog) confirmWorkflow(state.dialog.kind, state.dialog.recordId);
      });

      app.addEventListener('submit', (event) => {
        if (!event.target.matches('[data-action="search"]')) return;
        event.preventDefault();
        const searchQuery = String(new FormData(event.target).get('q') || '').trim();
        setState(publicSelectionPatch({ searchQuery, publicScenario: 'normal' }));
      });

      app.addEventListener('submit', (event) => {
        if (!event.target.matches('[data-action="login"]')) return;
        event.preventDefault();
        handleLogin(event.target);
      });

      app.addEventListener('change', (event) => {
        if (event.target.matches('[data-action="sort"]')) setState(publicSelectionPatch({ sortMode: event.target.value }));
        if (event.target.matches('[data-action="public-scenario"]')) setState({ publicScenario: event.target.value, route: 'home' });
        if (event.target.matches('[data-action="admin-market"]')) setState({ adminMarketFilter: event.target.value });
      });

      app.addEventListener('input', (event) => {
        if (event.target.matches('[data-action="admin-query"]')) setState({ adminQuery: event.target.value });
      });

      document.addEventListener('keydown', (event) => {
        if (state.companyDrawerOpen) {
          if (event.key === 'Escape') {
            event.preventDefault();
            closeCompanyDrawer();
            return;
          }
          if (event.key === 'Tab') {
            const drawer = app.querySelector('.company-directory--drawer');
            if (drawer) trapFocus(drawer, event);
          }
          return;
        }
        if (!state.dialog) return;
        if (event.key === 'Escape') {
          event.preventDefault();
          closeDialog();
          return;
        }
        if (event.key === 'Tab') {
          const dialog = app.querySelector('[role="dialog"]');
          if (dialog) trapFocus(dialog, event);
        }
      });

      window.prototypeApp = {
        navigate(route) { setState({ route, dialog: null, toast: null }); },
        setViewport(viewportMode) { setState({ viewportMode }); },
        reset() { state = { ...initialState }; render(); }
      };

      render();
    })();
  </script>
</body>
</html>
